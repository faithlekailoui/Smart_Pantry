name: smart_pantry
description: "Sous-Chef AI - a smart kitchen waste optimization mobile application."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local database (offline-first)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # State management
  flutter_riverpod: ^2.5.0

  # Gemini REST calls (see lib/SERVICES/ai_service.dart)
  http: ^1.2.0

  # On-device OCR for receipt scanning + picking images
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.0

  # PIN hashing
  crypto: ^3.0.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
